<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile, NPC dossier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0a13;font-family:'DM Sans',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #0b0a13; color: #ece8f6; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif">

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 108px; background: #12101c; border-bottom: 1px solid #2b2640"></div>
<div style="position: absolute; left: 16px; top: 132px; width: 358px; display: flex; flex-direction: column; gap: 14px"><div style="height: 14px; border-radius: 7px; background: #191627"></div><div style="height: 14px; width: 84%; border-radius: 7px; background: #191627"></div></div>
<div style="position: absolute; inset: 0; background: rgba(4,3,10,0.7)"></div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 717px; box-sizing: border-box; border-radius: 22px 22px 0 0; background: #12101c; border-top: 1px solid #3b3556; box-shadow: 0 -12px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden">

<div style="flex: none; display: flex; justify-content: center; padding: 10px 0 0 0"><span style="width: 40px; height: 4px; border-radius: 2px; background: #3b3556"></span></div>

<div style="flex: none; padding: 8px 20px 14px 20px; display: flex; gap: 14px; align-items: center">
<div style="width: 64px; height: 64px; flex: none; box-sizing: border-box; border-radius: 50%; border: 3px solid #a78bfa; background: #211d33; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-size: 28px; font-weight: 600; color: #a78bfa">K</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.1">Kiera</span><span style="font-size: 13px; color: #bfb9d3">Bartender and Tavern Owner</span><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8f89a8"><span style="width: 6px; height: 6px; border-radius: 50%; background: #8dc16b"></span>In the room · Guarded</span></div>
<button aria-label="Close dossier" style="width: 44px; height: 44px; border: 0; background: transparent; color: #8f89a8; display: flex; align-items: center; justify-content: center; align-self: flex-start"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>

<div style="flex: none; margin: 0 20px 12px 20px; padding: 12px; border-radius: 12px; background: #191627; border: 1px solid #2b2640; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 12px; color: #8f89a8">Toward you</span><span style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 600; color: #cdbdff">Friendly</span><span style="padding: 0 6px; border-radius: 999px; background: rgba(167,139,250,0.16); color: #cdbdff; font-size: 12px; font-weight: 600">+2</span></span></div>
<div style="position: relative; height: 6px; border-radius: 3px; background: #2b2640"><div style="width: 55%; height: 100%; border-radius: 3px; background: #a78bfa"></div><div style="position: absolute; left: 25%; top: -3px; width: 2px; height: 12px; background: #8f89a8"></div></div>
</div>

<div style="flex: none; display: flex; padding: 0 20px; border-bottom: 1px solid #2b2640">
<span style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #cdbdff; border-bottom: 2px solid #a78bfa">Known 4</span>
<span style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #8f89a8">History 2</span>
<span style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #8f89a8">Rumors 1</span>
</div>

<div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; line-height: 1.4">{{f.text}}</span><span style="font-size: 12px; color: #8f89a8">{{f.source}} · {{f.when}}</span></div>
</sc-for>
<div style="padding: 12px; border-radius: 12px; border: 1px dashed #3b3556; display: flex; align-items: center; gap: 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8f89a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; color: #8f89a8; letter-spacing: 0.15em">█████ ████ ███████</span><span style="font-size: 12px; color: #bfb9d3">Ask about the Silver Ledgers to learn more.</span></div></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center"><span style="font-size: 12px; color: #8f89a8">Still unknown:</span><span style="padding: 2px 10px; border-radius: 999px; border: 1px dashed #3b3556; font-size: 12px; color: #8f89a8">Age</span><span style="padding: 2px 10px; border-radius: 999px; border: 1px dashed #3b3556; font-size: 12px; color: #8f89a8">Origin</span><span style="padding: 2px 10px; border-radius: 999px; border: 1px dashed #3b3556; font-size: 12px; color: #8f89a8">Allegiance</span></div>
</div>

<div style="flex: none; box-sizing: border-box; padding: 12px 20px 24px 20px; background: #12101c; border-top: 1px solid #2b2640; display: flex; gap: 10px">
<button style="flex: 1; height: 48px; border: 0; border-radius: 12px; background: #a78bfa; color: #100a24; font: 700 15px 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>Speak to Kiera</button>
<button style="flex: 1; height: 48px; border-radius: 12px; border: 1px solid #3b3556; background: transparent; color: #ece8f6; font: 600 15px 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>Look closer</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const facts = [
{ text: 'Runs the Gilded Stag and lives above it.', source: 'Seen', when: 'Turn 3' },
{ text: 'Keeps a ledger behind the bar.', source: 'Overheard', when: 'Turn 9' },
{ text: 'Polishes mugs when she is nervous.', source: 'Observed', when: 'Turn 14' },
{ text: 'Distrusts the hooded stranger.', source: 'Told by Kiera', when: 'Turn 14' }
];
return { facts };
}
}
</script>
</body>
</html>

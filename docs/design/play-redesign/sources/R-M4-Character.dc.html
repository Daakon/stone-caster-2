<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile, character sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0a13;font-family:'DM Sans',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #0b0a13; color: #ece8f6; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif">

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 108px; background: #12101c; border-bottom: 1px solid #2b2640"></div>
<div style="position: absolute; inset: 0; background: rgba(4,3,10,0.7)"></div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 717px; box-sizing: border-box; border-radius: 22px 22px 0 0; background: #12101c; border-top: 1px solid #3b3556; box-shadow: 0 -12px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden">

<div style="flex: none; display: flex; justify-content: center; padding: 10px 0 0 0"><span style="width: 40px; height: 4px; border-radius: 2px; background: #3b3556"></span></div>

<div style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 0 20px; border-bottom: 1px solid #2b2640">
<div style="display: flex; gap: 18px">
<span style="height: 48px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: #cdbdff; border-bottom: 2px solid #a78bfa">Character</span>
<span style="height: 48px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: #8f89a8">Journal</span>
<span style="height: 48px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: #8f89a8">People</span>
<span style="height: 48px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: #8f89a8">Lore</span>
</div>
<button aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; color: #8f89a8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>

<div style="flex-grow: 1; min-height: 0; position: relative; overflow: hidden">
<div style="padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; gap: 14px; align-items: center">
<div style="width: 64px; height: 64px; flex: none; box-sizing: border-box; border-radius: 50%; border: 3px solid #a78bfa; background: #211d33; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-size: 28px; font-weight: 600; color: #a78bfa">D</div>
<div style="display: flex; flex-direction: column; gap: 3px"><span style="font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.1">Daakon</span><span style="font-size: 13px; color: #bfb9d3">Adventurer</span><span style="font-size: 12px; color: #8f89a8">Rested · Sated</span></div>
</div>

<div style="padding: 14px; border-radius: 14px; background: #191627; border: 1px solid #2b2640; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 5px"><div style="display: flex; justify-content: space-between; font-size: 13px"><span style="display: flex; align-items: center; gap: 8px; color: #bfb9d3"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e0575a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg>Health</span><span style="font-weight: 600">100 / 100</span></div><div style="height: 6px; border-radius: 3px; background: #2b2640"><div style="width: 100%; height: 100%; border-radius: 3px; background: #e0575a"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="display: flex; justify-content: space-between; font-size: 13px"><span style="display: flex; align-items: center; gap: 8px; color: #bfb9d3"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8dc16b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>Stamina</span><span style="font-weight: 600">90 / 100</span></div><div style="height: 6px; border-radius: 3px; background: #2b2640"><div style="width: 90%; height: 100%; border-radius: 3px; background: #8dc16b"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="display: flex; justify-content: space-between; font-size: 13px"><span style="display: flex; align-items: center; gap: 8px; color: #bfb9d3"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>Satiety</span><span style="font-weight: 600">80 / 100</span></div><div style="height: 6px; border-radius: 3px; background: #2b2640"><div style="width: 80%; height: 100%; border-radius: 3px; background: #2dd4bf"></div></div></div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8f89a8">Pillars</span>
<sc-for list="{{pillars}}" as="p" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span style="width: 84px; color: #bfb9d3">{{p.label}}</span><div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2b2640"><div style="height: 100%; border-radius: 2px; background: #bfb9d3; width: {{p.pct}}"></div></div><span style="width: 24px; text-align: right; font-weight: 600">{{p.val}}</span></div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8f89a8">Who you are</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="padding: 4px 12px; border-radius: 999px; background: #211d33; border: 1px solid #3b3556; font-size: 13px">Brave</span><span style="padding: 4px 12px; border-radius: 999px; background: #211d33; border: 1px solid #3b3556; font-size: 13px">Stoic</span><span style="padding: 4px 12px; border-radius: 999px; background: #211d33; border: 1px solid #3b3556; font-size: 13px; color: #a78bfa">Honor</span></div>
<span style="font-size: 14px; color: #bfb9d3">Taps fingers when thinking.</span>
</div>

<div style="padding: 14px; border-radius: 14px; background: #191627; border: 1px solid #2b2640; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #a78bfa"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>Objective</span>
<span style="font-size: 15px; line-height: 1.4">Find out who the stranger is waiting for.</span>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: linear-gradient(to top, #12101c, rgba(20,17,15,0))"></div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const pillars = [
{ label: 'Force', val: 40, pct: '40%' },
{ label: 'Finesse', val: 60, pct: '60%' },
{ label: 'Awareness', val: 55, pct: '55%' },
{ label: 'Insight', val: 45, pct: '45%' },
{ label: 'Influence', val: 50, pct: '50%' }
];
return { pillars };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile, action tray</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0a13;font-family:'DM Sans',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #0b0a13; color: #ece8f6; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif">

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 108px; background: #12101c; border-bottom: 1px solid #2b2640"></div>
<div style="position: absolute; left: 16px; top: 140px; width: 358px; display: flex; flex-direction: column; gap: 14px"><div style="height: 14px; border-radius: 7px; background: #191627"></div><div style="height: 14px; width: 80%; border-radius: 7px; background: #191627"></div><div style="height: 14px; width: 92%; border-radius: 7px; background: #191627"></div></div>
<div style="position: absolute; inset: 0; background: rgba(4,3,10,0.7)"></div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; box-sizing: border-box; border-radius: 22px 22px 0 0; background: #12101c; border-top: 1px solid #3b3556; box-shadow: 0 -12px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden">
<div style="flex: none; display: flex; justify-content: center; padding: 10px 0 6px 0"><span style="width: 40px; height: 4px; border-radius: 2px; background: #3b3556"></span></div>

<div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 8px 20px 0 20px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8f89a8">Quick actions</span>
<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
<button style="height: 76px; box-sizing: border-box; border-radius: 14px; border: 1px solid #3b3556; background: #191627; color: #ece8f6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 14px 'DM Sans', sans-serif"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a78bfa">{{q.tag}}</span>{{q.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8f89a8">Open</span>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<sc-for list="{{open}}" as="o" hint-placeholder-count="4">
<button style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #2b2640; background: #191627; color: #ece8f6; display: flex; align-items: center; justify-content: space-between; font: 500 15px 'DM Sans', sans-serif">{{o.label}}<span style="font-size: 12px; color: #8f89a8">{{o.hint}}</span></button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{menu}}" as="m" hint-placeholder-count="4">
<button style="height: 48px; border: 0; border-bottom: 1px solid #2b2640; background: transparent; color: {{m.color}}; text-align: left; font: 500 15px 'DM Sans', sans-serif">{{m.label}}</button>
</sc-for>
</div>

</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const quick = [
{ tag: '/look', label: 'Observe' },
{ tag: '/rest', label: 'Rest' },
{ tag: '/wait', label: 'Wait' }
];
const open = [
{ label: 'Journal', hint: '1 new' },
{ label: 'Character', hint: '' },
{ label: 'People', hint: '2' },
{ label: 'Lore', hint: '1' }
];
const menu = [
{ label: 'Save and exit', color: '#ece8f6' },
{ label: 'Download transcript', color: '#ece8f6' },
{ label: 'Report a problem', color: '#ece8f6' },
{ label: 'Abandon this story', color: '#f7a3a3' }
];
return { quick, open, menu };
}
}
</script>
</body>
</html>

name: API Documentation Validation

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/api-docs.yml"
      - "package.json"
      - "package-lock.json"
      - "backend/package.json"
      - "backend/src/routes/**"
      - "backend/src/config/swagger.ts"
      - "backend/scripts/**"
      - "backend/src/scripts/api-docs-ci.ts"
      - "backend/tests/api-docs-ci.test.ts"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/api-docs.yml"
      - "package.json"
      - "package-lock.json"
      - "backend/package.json"
      - "backend/src/routes/**"
      - "backend/src/config/swagger.ts"
      - "backend/scripts/**"
      - "backend/src/scripts/api-docs-ci.ts"
      - "backend/tests/api-docs-ci.test.ts"

permissions:
  contents: read

concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-api-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Build backend
        run: npm run build:server
      - name: Test documentation CLI
        run: npm exec --workspace=backend -- vitest run tests/api-docs-ci.test.ts
      - name: Validate declared API documentation
        run: npm run docs:validate --workspace=backend
      - name: Generate OpenAPI specification
        run: npm run docs:spec --workspace=backend -- "$RUNNER_TEMP/api-spec.json"
      - uses: actions/upload-artifact@v4
        with:
          name: api-specification
          path: ${{ runner.temp }}/api-spec.json
          if-no-files-found: error
          retention-days: 30
